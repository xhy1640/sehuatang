name: Build and Push ARM64 Docker Image

on:
  # 在推送到 main 分支时触发
  push:
    branches:
      - main
    # 仅当 Dockerfile 或相关代码发生变化时触发
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '**.py'
      - '.github/workflows/build-arm64.yml'
  # 允许手动触发
  workflow_dispatch:

env:
  # 您的 Docker 仓库和镜像名称
  IMAGE_NAME: your-docker-user/sehuatang-crawler
  # 目标架构标签
  PLATFORM_TAG: arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up QEMU (为跨平台构建启用 ARM 模拟)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: 🏷️ Determine metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.PLATFORM_TAG }}-,suffix=,format=short
            type=raw,value=${{ env.PLATFORM_TAG }}-latest,enable={{is_default_branch}}

      - name: 🚀 Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          # 指定 Dockerfile 路径
          context: .
          file: ./Dockerfile
          # 指定目标平台为 linux/arm64/v8
          platforms: linux/arm64/v8
          # 启用推送
          push: true
          # 使用 metadata action 生成的标签
          tags: ${{ steps.meta.outputs.tags }}
          # 构建参数
          build-args: |
            BUILDTIME=${{ steps.meta.outputs.created }}
            VERSION=1.0.0
            REVISION=${{ github.sha }}
          # 缓存设置
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: ✅ Show pushed tags
        run: echo "Successfully pushed ARM64 image with tags: ${{ steps.meta.outputs.tags }}"
