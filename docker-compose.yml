version: '3.8'

services:
  sehuatang-crawler:
    # 自行编译的多架构镜像（支持 linux/arm64 与 linux/amd64）
    image: xhy1640/sehuatang-crawler:latest
    container_name: sehuatang-crawler
    restart: unless-stopped
    stop_grace_period: 45s

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DOCKER_CONTAINER=true
      - PYTHONPATH=/app
      # Web 管理页访问令牌（务必与 config/config.yaml 的 web.token 保持一致）
      - SHT_WEB_TOKEN=change-me-to-a-long-random-string

    volumes:
      - ./config:/app/config   # 配置文件挂载（Web 界面在线编辑需要写权限）
      - ./logs:/app/logs       # 抓取日志目录（crawler.log / error.log）
      - crawler_data:/app/data # 本地数据兜底与断点续抓记录

    ports:
      - "8181:8181"            # Web 管理界面入口：http://127.0.0.1:8181

    networks:
      - crawler_network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    command: ["python", "run.py", "--mode", "web"]

  # ───────────────────────────────────────────────────────────────────
  # 【可选：CF 过盾服务 byparr】
  # 仅抓 sehuatang 论坛时，通常只需要 Discuz 登录 Cookie + 代理直连；
  # 若后续论坛启用了强力 Cloudflare 盾且报错 403/5秒盾，可取消下方注释启用，
  # 并在 config.yaml 中配置 flaresolverr_url: "http://byparr:8191/v1"
  # ───────────────────────────────────────────────────────────────────
  # byparr:
  #   image: ghcr.io/thephaseless/byparr:latest
  #   container_name: byparr
  #   restart: unless-stopped
  #   environment:
  #     - TZ=Asia/Shanghai
  #   ports:
  #     - "8191:8191"
  #   networks:
  #     - crawler_network

networks:
  crawler_network:
    driver: bridge
    name: sehuatang_network

volumes:
  crawler_data:
    name: sehuatang_data
